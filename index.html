<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Malovaný les</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-screen painted 3D forest; HUD in the top corners; one reading panel docked at the bottom. */
  --ink:#1b2745;      /* deník ink */
  --paper:#fdf8ea;    /* deník page */
  --teal:#178a98;     /* Vendulka's jacket */
  --red:#d8402f;      /* her hat */
  --gold:#f4b72e;     /* her backpack, primary action */
  --leaf:#4c9a3a;     /* correct answer */
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --read: clamp(22px, 3.1vw, 40px);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#e9d2b0;font-family:var(--display);color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--teal);outline-offset:3px}

.pill{background:var(--paper);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 rgba(27,39,69,.55);
  font-weight:800;letter-spacing:.04em;line-height:1;padding:.55em 1em;font-size:clamp(14px,1.5vw,20px)}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,39,69,.55)}

#hud{position:fixed;inset:0;pointer-events:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#hud > *{pointer-events:auto}
#seasons,#tools{display:flex;flex-wrap:wrap;gap:8px}
#tools{justify-content:flex-end}
#seasons .pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#seasons .pill:disabled{opacity:.55;cursor:default;border-style:dashed}
#seasons .pill:disabled::after{content:" ?"}
#btnJournal{background:var(--gold)}
#btnJournal.new{animation:wig .5s ease-in-out 4}
#jcount{font-variant-numeric:tabular-nums}

#quest{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  border-radius:20px;padding:.3em 1em;font-weight:800;font-size:clamp(22px,3vw,38px);letter-spacing:.04em;
  font-variant-numeric:tabular-nums;white-space:nowrap}

#dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#dock > *{pointer-events:auto}
#btnExplore{background:var(--gold);font-size:clamp(20px,2.6vw,32px);padding:.55em 1.2em;animation:bob 1.4s ease-in-out infinite}
#btnBack{align-self:flex-end}
#panel{width:min(940px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:28px;
  box-shadow:0 8px 0 rgba(27,39,69,.5);padding:18px 24px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
#text{margin:0;font-size:var(--read);font-weight:800;line-height:1.22;letter-spacing:.035em;text-align:center;text-wrap:balance;max-width:26ch}
#word{display:flex;gap:.18em;font-size:clamp(44px,7vw,84px);font-weight:800;line-height:1}
#word span{display:inline-flex;align-items:center;justify-content:center;min-width:.95em;height:1.25em;padding:0 .08em;
  border-bottom:6px solid var(--ink)}
#word span.gap{background:#fff;border:5px dashed var(--teal);border-radius:14px;color:var(--teal)}
#word span.hit{background:var(--leaf);border:5px solid var(--ink);border-radius:14px;color:#fff}
#choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.choice{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);
  font-size:calc(var(--read)*.92);font-weight:800;letter-spacing:.04em;line-height:1;padding:.5em .9em;min-width:3.2em;min-height:64px}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.choice.ok{background:var(--leaf);color:#fff}
.choice.no{background:var(--red);color:#fff;animation:shake .4s}
#btnNext{background:var(--gold);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);
  font-size:calc(var(--read)*.8);font-weight:800;letter-spacing:.06em;line-height:1;padding:.45em 1.3em;min-height:58px}
#btnNext:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

.sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(27,39,69,.45)}
#title{background:linear-gradient(rgba(27,39,69,.05),rgba(27,39,69,.45))}
#titleCard{background:var(--paper);border:5px solid var(--ink);border-radius:36px;box-shadow:0 10px 0 rgba(27,39,69,.55);
  padding:28px 40px 32px;text-align:center;max-width:min(680px,100%);display:flex;flex-direction:column;gap:14px;align-items:center}
#titleCard h1{margin:0;font-size:clamp(40px,7vw,84px);line-height:.95;letter-spacing:.03em;font-weight:800;text-wrap:balance}
#titleCard h1 b{color:var(--teal)}
#titleCard p{margin:0;font-size:clamp(18px,2.4vw,28px);font-weight:800;letter-spacing:.04em;line-height:1.25;text-wrap:balance}
#btnPlay{background:var(--gold);border:5px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);
  font-size:clamp(28px,4.4vw,52px);font-weight:800;letter-spacing:.08em;line-height:1;padding:.4em 1.4em;margin-top:6px}
#btnPlay:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
#btnPlay:disabled{opacity:.6}
#titleCard small{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75;max-width:46ch;line-height:1.35}

#journalCard{background:var(--paper);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 rgba(27,39,69,.55);
  width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#journalCard header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:4px solid var(--ink)}
#journalCard h2{margin:0;font-size:clamp(22px,3vw,38px);letter-spacing:.04em;line-height:1}
#pages{overflow-y:auto;touch-action:pan-y;padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.page{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;
  border-top-width:14px}
.page[data-s="0"]{border-top-color:#7cc24a}.page[data-s="1"]{border-top-color:#2f8a3c}
.page[data-s="2"]{border-top-color:#e08a1e}.page[data-s="3"]{border-top-color:#8fb0de}
.page h3{margin:0;font-size:20px;letter-spacing:.04em;line-height:1.1}
.page .tag{font-size:13px;font-weight:800;letter-spacing:.1em;opacity:.65}
.page p{margin:0;font-size:22px;font-weight:800;letter-spacing:.03em;line-height:1.25}
.page.locked{background:transparent;border-style:dashed;border-top-style:solid;opacity:.6}
#journalCard footer{padding:10px 22px 14px;display:flex;justify-content:flex-end}
#btnReset{font-size:13px;font-weight:600;text-decoration:underline;opacity:.7;padding:6px}

@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes wig{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media (max-width:560px){ #hud{padding:10px} .pill{padding:.5em .7em} #panel{padding:14px 14px 16px;border-radius:22px} }
@media (max-height:520px){ :root{--read:clamp(18px,4.6vh,30px)} #panel{gap:8px;padding:10px 16px 12px} .choice{min-height:48px} #btnNext{min-height:46px} }
@media (prefers-reduced-motion:reduce){ #btnExplore,#btnJournal.new{animation:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="seasons" role="group" aria-label="Roční období">
    <button class="pill" data-s="2" aria-pressed="false">PODZIM</button>
    <button class="pill" data-s="3" aria-pressed="false">ZIMA</button>
    <button class="pill" data-s="0" aria-pressed="false">JARO</button>
    <button class="pill" data-s="1" aria-pressed="false">LÉTO</button>
  </div>
  <div id="tools">
    <button class="pill" id="btnJournal">DENÍK <span id="jcount">0/12</span></button>
    <button class="pill" id="btnSound" aria-pressed="true">ZVUK ANO</button>
  </div>
</div>

<div id="quest" hidden></div>

<div id="dock">
  <button class="pill" id="btnBack" hidden>ZPĚT DO LESA</button>
  <button class="pill" id="btnExplore" hidden></button>
  <div id="panel" hidden>
    <div id="word" hidden></div>
    <p id="text"></p>
    <div id="choices"></div>
    <button id="btnNext">DÁL</button>
  </div>
</div>

<div id="journal" class="sheet" hidden>
  <div id="journalCard">
    <header><h2>DENÍK BADATELKY VENDULKY</h2><button class="pill" id="btnCloseJournal">ZAVŘÍT</button></header>
    <div id="pages"></div>
    <footer><button id="btnReset">Začít hru od začátku</button></footer>
  </div>
</div>

<div id="title" class="sheet">
  <div id="titleCard">
    <h1>MALOVANÝ <b>LES</b></h1>
    <p>VENDULKA NAŠLA V LESE PRÁZDNÝ DENÍK. POMOZ JÍ HO ZAPLNIT OBJEVY!</p>
    <button id="btnPlay" disabled>MALUJI LES…</button>
    <small>Pro rodiče: kliknutím nebo ťuknutím na zem Vendulka dojde na místo, tažením se otáčí pohled, šipky fungují také. Texty jsou velkými tiskacími písmeny a dítě je čte samo.</small>
  </div>
</div>

<script>
/* The title card paints first; then the 3D library and the forest load in order. */
(function(){
  const LIBS=['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://unpkg.com/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js','three.min.js'];
  const note=document.querySelector('#titleCard small'),btn=document.getElementById('btnPlay');
  function fail(msg){if(window.__les)return;btn.textContent='NEJDE TO';note.textContent=msg;}
  function load(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=res;s.onerror=rej;document.body.appendChild(s);});}
  window.addEventListener('error',()=>fail('Les se nepodařilo namalovat. Tento prohlížeč nebo zařízení nejspíš nepodporuje 3D grafiku (WebGL 2). Zkus jiný prohlížeč.'));
  (async function(){
    let ok=false;
    for(const u of LIBS){try{await load(u);}catch(e){}if(window.THREE){ok=true;break;}}
    if(!ok){fail('Hru se nepodařilo načíst. Zkontroluj připojení k internetu a načti stránku znovu.');return;}
    await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,40)));
    try{for(const f of['paint.js','world.js','game.js'])await load(f);}
    catch(e){fail('Hru se nepodařilo načíst. Zkontroluj připojení k internetu a načti stránku znovu.');}
  })();
})();
</script>
</body>
</html>
